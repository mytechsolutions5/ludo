<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="yellowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Ludo Board Outline -->
  <g filter="url(#shadow)">
    <rect x="76" y="76" width="360" height="360" rx="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" />
    
    <!-- Quadrants -->
    <rect x="96" y="96" width="130" height="130" rx="20" fill="url(#redG)" />
    <rect x="286" y="96" width="130" height="130" rx="20" fill="url(#greenG)" />
    <rect x="286" y="286" width="130" height="130" rx="20" fill="url(#yellowG)" />
    <rect x="96" y="286" width="130" height="130" rx="20" fill="url(#blueG)" />

    <!-- Center Dice -->
    <rect x="206" y="206" width="100" height="100" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
    <!-- 6 Pips -->
    <circle cx="231" cy="231" r="7" fill="#ef4444" />
    <circle cx="231" cy="256" r="7" fill="#ef4444" />
    <circle cx="231" cy="281" r="7" fill="#ef4444" />
    <circle cx="281" cy="231" r="7" fill="#ef4444" />
    <circle cx="281" cy="256" r="7" fill="#ef4444" />
    <circle cx="281" cy="281" r="7" fill="#ef4444" />
  </g>
</svg>